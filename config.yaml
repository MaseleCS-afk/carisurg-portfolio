seed: 42

data:
  raw_path: "data/yaleemmlc_admissionprediction_triage.csv"
  target: "esi"

# One decision, one model, one frozen set of hyperparameters — in a file,
# not in our heads. Random Forest is the pinned default per the Week 7
# cost-benefit memo (best ESI-1 recall + cheapest to explain to Clinical IT).
# Gradient Boosting stays pinned as the second finalist for future reference.
final_models: ["random_forest", "gradient_boosting"]

models:
  random_forest:
    n_estimators: 200        # frozen — Week 7 RandomizedSearchCV winner
    min_samples_leaf: 8       # frozen — Week 7 RandomizedSearchCV winner
    max_features: null        # frozen — Week 7 RandomizedSearchCV winner
    max_depth: null           # frozen — Week 7 RandomizedSearchCV winner
    class_weight: "balanced"

  gradient_boosting:
    max_depth: 6
    learning_rate: 0.1
    max_iter: 300
    class_weight: "balanced"

  logistic_regression:        # kept for the Week 6 baseline comparison
    max_iter: 1000

  mlp:                        # kept for reference — not deployed (Week 7 memo)
    hidden_layer_sizes: [64, 32]
    alpha: 0.001
    max_iter: 500

include_demographics: false   # off by default — fairness (Week 7 ethics note)
